name: Export D1 -> repo (cotes denses)

# Rapatrie chaque lundi les prix captés par le Worker (D1) dans le repo, en gzip.
# Secrets : WORKER_URL, READ_TOKEN.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: export-d1
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exporter prix et clôtures
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/raw/d1
          STAMP=$(date -u +%Y%m%dT%H%MZ)
          SINCE=$(cat data/raw/d1/last_ts 2>/dev/null || echo "1970-01-01T00:00:00Z")
          while : ; do
            curl -fsS -D headers.txt -H "Authorization: Bearer $READ_TOKEN" \
              "$WORKER_URL/export?since=$SINCE&snapshots=40" -o page.csv
            NEXT=$(grep -i '^x-next-since:' headers.txt | cut -d' ' -f2 | tr -d '\r')
            [ -z "$NEXT" ] && break
            if [ "$(wc -l < page.csv)" -gt 1 ]; then
              gzip -c page.csv > "data/raw/d1/prices_${NEXT//:/}.csv.gz"
            fi
            SINCE="$NEXT"
            echo "$SINCE" > data/raw/d1/last_ts
          done
          FROM=$(date -u -d "14 days ago" +%Y-%m-%d)
          curl -fsS -H "Authorization: Bearer $READ_TOKEN" \
            "$WORKER_URL/closing?from=$FROM" | gzip -c > "data/raw/d1/closing_${STAMP}.csv.gz"
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/d1/
          git diff --cached --quiet || git commit -m "data(d1): export cotes denses $(date -u +%F)"
          git push
